name: Direct download build (Stripe) + emulator test
# Direct-download build of this app (GitHub Releases / charleshartmann.com): same code, built with -Pstore=direct
# (Stripe Checkout instead of Google Play Billing, no Google Play links, no Play review prompt).
# Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [direct-stripe]
  workflow_dispatch:
    inputs:
      steps:
        description: steps file under .github/direct (steps-release.txt or steps-restore.txt)
        default: steps-release.txt
permissions:
  contents: write
concurrency:
  group: direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Decode keystore
      run: printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d -i > nutrisnap-release.jks
    - name: Create google-services.json
      run: printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d -i > app/google-services.json
    - name: Validate google-services.json
      run: python3 -c "import json,sys; json.load(open('app/google-services.json')); print('OK')"
    - name: Create local.properties
      env:
        GH_PROXY_URL: ${{ secrets.GH_PROXY_URL }}
        GH_PROXY_SECRET: ${{ secrets.GH_PROXY_SECRET }}
        ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      run: |
        echo "sdk.dir=$ANDROID_HOME" >> local.properties
        echo "nutrisnap.storeFile=nutrisnap-release.jks" >> local.properties
        echo "nutrisnap.storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
        echo "nutrisnap.keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
        echo "nutrisnap.keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
        echo "github.proxy.url=$GH_PROXY_URL" >> local.properties
        echo "github.proxy.secret=$GH_PROXY_SECRET" >> local.properties
        echo "admob.app.id=$ADMOB_APP_ID" >> local.properties
        echo "admob.banner.id=$ADMOB_BANNER_ID" >> local.properties
        echo "admob.interstitial.id=$ADMOB_INTERSTITIAL_ID" >> local.properties
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - name: Build direct APK (store=direct)
      env: {}
      run: |
        set -o pipefail
        ./gradlew assembleRelease -Pstore=direct  --no-daemon 2>&1 | tee -a /tmp/dsk-build.log
        cd "$GITHUB_WORKSPACE"
        mkdir -p dsk-apk
        A=$(find . -path "*/build/outputs/apk/*release*/*.apk" ! -name "*unsigned*" | head -1); [ -z "$A" ] && A=$(find . -path "*/build/outputs/apk/*release*/*.apk" | head -1)
        cp "$A" dsk-apk/NutriSnap-direct-release.apk
        ls -la dsk-apk
        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
        $BT/apksigner verify --print-certs dsk-apk/NutriSnap-direct-release.apk | head -3 || true
        $BT/aapt2 dump badging dsk-apk/NutriSnap-direct-release.apk | head -3 || true
        echo "--- Play Store URL strings left in the direct release dex:"; unzip -p dsk-apk/NutriSnap-direct-release.apk "classes*.dex" | strings | grep -E "play\.google\.com/store|market://" | head || true
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        tail -c 60000 /tmp/dsk-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/dsklog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - name: Emulator test (phone, Google APIs, no Play Store)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: pixel_5
        target: google_apis
        arch: x86_64
        ram-size: 3072M
        disk-size: 8192M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: STEPS_FILE=${{ github.event.inputs.steps || 'steps-release.txt' }} bash .github/direct/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        bash .github/direct/direct-upload.sh /tmp/dsk-out dsk_NutriSnap_r${{ github.run_number }}
    - name: Draft release with the direct APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: direct-${{ github.run_number }}
        name: Direct build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: dsk-apk/NutriSnap-direct-release.apk
