name: NutriSnap signed candidate (build only)
on:
  workflow_dispatch:
    inputs:
      confirm_play_publish:
        description: Must be build-only (never publish)
        required: true
        type: string
      release_notes:
        description: Base64 public certificate and exact version request; no private data
        required: true
        type: string
permissions:
  contents: read
jobs:
  signed-candidate:
    if: github.event.inputs.confirm_play_publish == 'build-only' && github.ref_name == 'tab/nutrisnap-play-build-20261122' && github.repository == 'chartmann1590/nutrisnap'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare exact version and production Android client configuration
        env:
          REQUEST: ${{ github.event.inputs.release_notes }}
          GS_CLIENT_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          python3 scripts/tab-build-only-nutrisnap.py setup
      - name: Test, lint, and build release candidate without signing or telemetry publication
        env:
          GH_PROXY_URL: ${{ secrets.GH_PROXY_URL }}
          GH_PROXY_SECRET: ${{ secrets.GH_PROXY_SECRET }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          set -euo pipefail
          python3 scripts/tab-build-only-nutrisnap.py check-env
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 -I scripts/tab-build-only-nutrisnap.init.gradle :app:testReleaseUnitTest --tests '*AiReportPrivacyTest' --tests '*ScanViewModelTest' :app:lintRelease :app:bundleRelease
      - name: Validate, sign and encrypt only the exact bundle
        env:
          NUTRI_RELEASE_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          NUTRI_RELEASE_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          NUTRI_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NUTRI_RELEASE_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/tab-build-only-nutrisnap.py sign-and-wrap
      - uses: actions/upload-artifact@v4
        with:
          name: nutrisnap-encrypted-signed-candidate
          path: ${{ runner.temp }}/nutrisnap-candidate.cms
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Remove ephemeral release inputs
        if: always()
        run: rm -f -- app/google-services.json "$RUNNER_TEMP/nutrisnap-candidate.cms" "$RUNNER_TEMP/nutrisnap-recipient.pem"
